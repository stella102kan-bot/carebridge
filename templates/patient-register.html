<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareBridge - 患者註冊</title>
</head>

<body>

    <h1>首次註冊</h1>

    <p>請填寫您的基本資料。</p>

    <form action="/register" method="POST">

        <label>姓名：</label>
        <input
            type="text"
            name="name"
            required
        >

        <br><br>

        <label>身分證字號：</label>
        <input
            type="text"
            name="id_number"
            maxlength="10"
            required
        >

        <br><br>

        <label>生日：</label>
        <input
            type="date"
            name="birthDate"
            required
        >

        <br><br>

        <label>性別：</label>

        <select name="gender">
            <option value="male">男性</option>
            <option value="female">女性</option>
            <option value="other">其他</option>
        </select>

        <br><br>

        <label>電話：</label>
        <input
            type="tel"
            name="phone"
            required
        >

        <br><br>

        <button type="submit">
            完成註冊
        </button>

    </form>

    <br>

    <button onclick="location.href='/patient'">
        返回患者登入
    </button>

</body>

</html>

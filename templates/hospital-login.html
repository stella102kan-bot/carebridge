<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>CareBridge - 醫院端登入</title>
</head>

<body>

    <h1>CareBridge 醫院端</h1>

    <h2>櫃台／醫護人員登入</h2>

    <form action="/hospital-login" method="POST">

        <label>帳號：</label>
        <input
            type="text"
            name="username"
            required
        >

        <br><br>

        <label>密碼：</label>
        <input
            type="password"
            name="password"
            required
        >

        <br><br>

        <button type="submit">
            登入
        </button>

    </form>

    <br>

    <button onclick="location.href='/'">
        回到首頁
    </button>

</body>

</html>
